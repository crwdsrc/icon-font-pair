server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The build writes .gz copies next to each file; serve those when the browser accepts gzip.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # The page loads icon data from the Iconify API, Google Fonts, and Fontsource fonts from jsDelivr.
    # connect-src allows data: because Web Awesome loads its built-in icons as data URIs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' data: https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # expires sets Cache-Control without add_header, so these locations keep the security headers above.
    # Always revalidate the page so a deploy shows up immediately.
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location = /index.html {
        expires -1;
    }

    # Vite puts a content hash in every file name under /assets, so these files never change.
    # The pattern also matches /<any path>/assets/..., so the site works under a path prefix
    # whether or not the proxy in front strips that prefix.
    location ~ ^(?:/[^/]+)*/assets/(?<asset>[^/]+)$ {
        expires 1y;
        try_files /assets/$asset =404;
    }

    # Any other path gets the page, for the same reason.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
